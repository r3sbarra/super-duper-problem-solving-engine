[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "super-duper-problem-solving-engine"
version = "0.1.0"
description = "Neurosymbolic AI reasoning and autonomous scientific problem solving engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "r3sbarra" }
]
keywords = [
    "neurosymbolic",
    "ai-reasoning",
    "scientific-discovery",
    "triz",
    "strong-inference",
    "sat-solver",
    "boed",
    "vector-symbolic-architecture"
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "click>=8.0.0",
    "rich>=13.0.0"
]

[project.urls]
Homepage = "https://github.com/r3sbarra/super-duper-problem-solving-engine"
Repository = "https://github.com/r3sbarra/super-duper-problem-solving-engine.git"
Issues = "https://github.com/r3sbarra/super-duper-problem-solving-engine/issues"
Documentation = "https://github.com/r3sbarra/super-duper-problem-solving-engine#readme"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=4.0.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0"
]

[project.scripts]
super-solver = "super_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["super_solver"]
omit = ["tests/*"]
